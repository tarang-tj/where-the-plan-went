# AI/BI dashboard over the gold tables (generated by `python -m wtpw.dashboard`).
variables:
  warehouse_id:
    description: SQL warehouse that serves the dashboard
    lookup:
      warehouse: Serverless Starter Warehouse

resources:
  dashboards:
    plan_vs_actual:
      display_name: Where the plan went
      file_path: ../dashboards/where-the-plan-went.lvdash.json
      warehouse_id: ${var.warehouse_id}
